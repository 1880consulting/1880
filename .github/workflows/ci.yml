name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: studio
          MYSQL_USER: studio
          MYSQL_PASSWORD: studio
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ustudio -pstudio"
          --health-interval=2s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql://studio:studio@127.0.0.1:3306/studio
      TEST_DATABASE_URL: mysql://studio:studio@127.0.0.1:3306/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
